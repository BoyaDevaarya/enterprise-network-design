services:
  - type: web
    name: enterprisenet-portal
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
